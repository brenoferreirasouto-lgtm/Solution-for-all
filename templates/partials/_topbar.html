<header class="topo">
  {% if voltar_url %}
    <a class="topo__voltar" href="{{ voltar_url }}" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  {% endif %}
  {% include "partials/_marca.html" with classe="marca--topo" %}
  <button class="topo__menu" type="button" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false" data-menu-abrir>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>
